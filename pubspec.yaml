name: islamic_app
description: "Islamic App For Quran"

publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.0
  retrofit: ^4.9.2
  json_annotation: ^4.10.0
  dio: ^5.9.1
  google_fonts: ^8.0.1
  audioplayers: ^6.5.1
  flutter_native_splash: ^2.4.7
  shared_preferences: ^2.5.4
  flutter_launcher_icons: ^0.14.4
  dartz: ^0.10.1
  retrofit_generator: ^10.2.3
  flutter_bloc: ^9.1.1
  skeletonizer: ^2.1.3
  hugeicons: ^1.1.5
  geolocator: ^14.0.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  json_serializable: ^6.12.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon_2.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

